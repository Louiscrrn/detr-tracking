[project]
name = "detr-tracking"
version = "0.1.0"
description = "Real-time multi-object tracking with RF-DETR and ByteTrack, served behind a tested API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rfdetr[train]>=1.12,<2",
    "supervision>=0.31,<0.32",
    "torch>=2.8",
    "torchvision>=0.23",
    "numpy>=2",
    "pillow>=11",
    "opencv-python-headless>=4.10",
    "pycocotools>=2.0.8",
    "mlflow>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detr_tracking"]

# Wheels CPU de torch sous Linux (CI, Docker) ; macOS garde les wheels PyPI (MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights or network (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
